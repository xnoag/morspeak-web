<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="모스픽 사용자별 표현 카테고리와 사용 현황을 한곳에서 확인합니다.">
  <title>Morspeak — 사용 현황</title>
  <link rel="license" href="/NOTICE.txt">
  <link rel="stylesheet" href="/gaon-tokens.css">
  <link rel="stylesheet" href="/style.css?v=12">
  <script defer src="/feature-metrics.js?v=12"></script>
  <script defer src="/replay.js?v=12"></script>
  <script defer src="/shared-usage-ui.js?v=12"></script>
  <script defer src="/app.js?v=12"></script>
</head>
<body class="gaon-theme">
  <svg class="symbol-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"/></symbol>
    <symbol id="speech" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0Z"/><path d="M7 9h8M7 13h5"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v6M17 2v6M3 11h18M7 15h2M13 15h2"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="share" viewBox="0 0 24 24"><path d="M12 16V3m-4 4 4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
    <symbol id="download" viewBox="0 0 24 24"><path d="M12 3v13m-4-4 4 4 4-4M4 17v3h16v-3"/></symbol>
    <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
    <symbol id="step" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7ZM19 5v14"/></symbol>
    <symbol id="restart" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2 8M4 4v6h6"/></symbol>
  </svg>
  <div class="shell">
    <header class="topbar">
      <img class="brand-logo" src="/morspeak-logo.svg" alt="Morspeak" width="129" height="36"><span class="slash">/</span><span class="top-title">Tracking</span>
      <div class="top-actions">
        <button class="icon-button" id="export-all" aria-label="전체 데이터 다운로드" title="데이터 다운로드"><svg><use href="#download"/></svg></button>
        <button class="icon-button" id="share-link" aria-label="현재 화면 링크 복사" title="현재 화면 링크 복사"><svg><use href="#share"/></svg></button>
      </div>
    </header>
    <section class="workspace" aria-label="사용자 작업 공간">
      <aside class="sidebar" aria-label="사용자 목록">
        <label class="search person-search"><svg><use href="#search"/></svg><input id="person-search" type="search" placeholder="사용자 검색" aria-label="사용자 검색" autocomplete="off"></label>
        <div class="sidebar-label">사용자 <span class="count-badge" id="person-count">—</span></div>
        <div id="person-list" class="person-list"><p class="muted">불러오는 중…</p></div>
        <p id="person-empty" class="empty-small" hidden>검색 결과가 없습니다.</p>
        <div class="sidebar-foot"><span class="small-dot"></span><span><span id="people-summary">사용자</span><br><small id="report-period">2026.08.01 — 10.31</small></span></div>
      </aside>
      <main class="main" id="main">
        <header class="detail-header">
          <button id="mobile-back" class="icon-button mobile-back" aria-label="사용자 목록으로"><svg><use href="#arrow"/></svg></button>
          <div class="identity"><strong id="person-name">사용자</strong><span id="person-type"></span></div>
        </header>
        <nav class="tabs" aria-label="사용자 상세 탐색">
          <button data-view="overview" class="tab active" aria-pressed="true">개요</button>
          <button data-view="features" class="tab" aria-pressed="false">기능 사용</button>
          <button data-view="daily" class="tab" aria-pressed="false">일별 데이터</button>
          <button data-view="sessions" class="tab" aria-pressed="false">세션 기록</button>
        </nav>
        <div class="replay-bar" aria-label="기록 업데이트">
          <div class="replay-description"><span id="replay-state">기록 확인 중</span><span id="replay-latest" role="status" aria-live="polite"></span></div>
          <button id="replay-pending" class="text-button" hidden>새 기록 보기</button>
          <button id="usage-refresh" class="icon-button" aria-label="최신 기록 확인" title="최신 기록 확인"><svg><use href="#restart"/></svg></button>
        </div>
        <div class="content-scroll" id="content-scroll"><div id="content" aria-live="polite"><div class="empty-state">데이터를 불러오고 있습니다.</div></div></div>
      </main>
    </section>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
